<figure data-name="s4-read-wall"><div class="slide "><div class="band"></div><div class="inner"><h3>Passwords</h3><p class="para">A password is a secret word or phrase that you use to get into your accounts, and if somebody guesses it or finds it out they can get into your email, your social media and sometimes your bank, so it is very important to make it hard to guess. Many people use the same password on lots of websites, which means that if one website is hacked, criminals can try the same password everywhere else. Experts say you should use three random words, and you should turn on two-step verification wherever you can.</p></div></div></figure>
