<style>

  /* Topic 1: a forum thread. */

  .forum .trail span { color: #46525e; padding: 0 4px; }
  .forum h3 { margin: 10px 12px 2px; font-size: 16px; color: #14202b; }
  .forum .meta { margin: 0 12px 8px; font-size: 11.5px; color: #46525e; }

  .forum .who { background: #f4f6f8; padding: 9px 10px; font-size: 11.5px; color: #46525e; border-right: 1px solid #9aa5b1; }

  .forum .said { padding: 9px 12px; color: #2c3640; }

  .phone { width: 270px; border: 8px solid #2a3139; border-radius: 24px; overflow: hidden; background: #fff; }

  .chat .m { max-width: 78%; padding: 7px 10px; border-radius: 12px; font-size: 12.5px; line-height: 1.35; }
  .chat .in { background: #fff; border: 1px solid #9aa5b1; align-self: flex-start; color: #1b1f24; }
  .chat .out { background: #d6e6f5; border: 1px solid #7f9fbd; align-self: flex-end; color: #14202b; }
  .chat .t { font-size: 10.5px; color: #46525e; align-self: flex-end; margin-top: -4px; }
  .chat .typing { align-self: flex-start; font-size: 11px; color: #46525e; font-style: italic; }
  .chat .type { border-top: 1px solid #9aa5b1; padding: 8px 10px; font-size: 12px; color: #5d6975; }

  /* Topic 1: a blog post. */
  .blog { width: 460px; }
  .blog .mast { padding: 12px 16px 8px; border-bottom: 1px solid #9aa5b1; font: 600 18px/1.2 Georgia, "Times New Roman", serif; color: #14202b; }
  .blog .mast small { display: block; font: 12px "Segoe UI", Inter, system-ui, sans-serif; color: #46525e; margin-top: 2px; }
  .blog article { padding: 12px 16px; font: 13px/1.6 Georgia, "Times New Roman", serif; color: #2c3640; }
  .blog article h3 { font: 600 16px/1.25 "Segoe UI", Inter, system-ui, sans-serif; color: #14202b; margin: 0 0 3px; }
  .blog article .date { font: 11.5px "Segoe UI", Inter, system-ui, sans-serif; color: #46525e; margin-bottom: 8px; }

  .blog .comments b { color: #1b1f24; }
  .blog .comments div + div { margin-top: 5px; }

  /* Topic 1 and 5: a video call. */
  .call { width: 520px; }
  .call .grid { background: #1e2530; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .call .tile { background: #3a4652; border-radius: 6px; height: 112px; position: relative; overflow: hidden; }
  .call .tile svg { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); }
  .call .name { position: absolute; left: 6px; bottom: 6px; background: #1e2530; color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 4px; }

  .call .tool.end span:first-child { background: #c22d2d; }
  .call .tool .num { font-size: 11px; line-height: 17px; min-width: 17px; }

  /* Topic 2 and 3: an email being read or written. */
  .mail { width: 500px; }
  .mail .row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #9aa5b1; font-size: 12.5px; color: #3c4753; }
  .mail .row .k { width: 58px; color: #46525e; flex: none; }
  .mail .row .v { color: #1b1f24; flex: 1; }
  .mail .chip { display: inline-flex; align-items: center; gap: 5px; background: #e3ecf4; border: 1px solid #7f9fbd; border-radius: 12px; padding: 2px 10px; font-size: 12px; color: #14202b; }
  .mail .body { padding: 12px; font-size: 13px; line-height: 1.55; color: #2c3640; }
  .mail .body p { margin: 0 0 8px; }
  .mail .file { display: inline-flex; align-items: center; gap: 9px; border: 1.5px solid #5d6975; border-radius: 6px; padding: 7px 12px; font-size: 12.5px; color: #1b1f24; margin: 4px 12px 12px; }
  .mail .file small { display: block; color: #46525e; font-size: 11px; }
  .mail .foot { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid #9aa5b1; }
  .mail .foot .btn { padding: 6px 16px; }

  /* Topic 3: three replies with different tones. */
  .tone { width: 300px; }
  .tone .body { padding: 12px; font-size: 13px; line-height: 1.5; color: #2c3640; min-height: 176px; }
  .tone .body p { margin: 0 0 7px; }
  .tone .bar { font-size: 11.5px; }

  /* Topic 4: social media posts. */
  .post { width: 400px; }
  .post.small { width: 300px; }
  .post .head { display: flex; gap: 9px; align-items: center; padding: 10px 12px 6px; }
  .post .head i { width: 34px; height: 34px; border-radius: 50%; background: #2d5677; color: #fff; display: grid; place-items: center;
                  font: 700 13px/1 "Segoe UI", Inter, system-ui, sans-serif; font-style: normal; flex: none; }
  .post .head b { display: block; font-size: 13px; color: #1b1f24; }
  .post .head small { display: block; font-size: 11px; color: #46525e; }
  .post .text { padding: 2px 12px 9px; font-size: 13px; line-height: 1.5; color: #1b1f24; }
  .post.small .text { font-size: 12.5px; min-height: 64px; }
  .post .tag { color: #1d4f91; }
  .post .pic { background: #f3e3c8; height: 150px; display: grid; place-items: center; }
  .post.small .pic { height: 108px; }
  .post .acts { display: flex; justify-content: space-around; padding: 7px 12px; border-top: 1px solid #9aa5b1; font-size: 12px; color: #3c4753; }
  .post .mark { display: inline-flex; align-items: center; gap: 5px; }

  /* Topic 6: a phishing email and a fake warning. */
  .phish { width: 480px; }
  .phish .body { padding: 14px; font-size: 13px; line-height: 1.55; color: #2c3640; }
  .phish .body p { margin: 0 0 9px; }
  .phish .warn { color: #b02a2a; font-weight: 700; }
  .popup { width: 440px; }

  .popup .box p { margin: 0 0 10px; font-size: 13px; color: #2c3640; }
  .popup .box .btn { background: #b02a2a; font-size: 13px; padding: 9px 18px; }
  .popup .box small { display: block; margin-top: 8px; font-size: 11.5px; color: #46525e; }

  /* Topic 7: a public profile. */
  .profile { width: 420px; }

  .profile .who i { width: 64px; height: 64px; border-radius: 50%; background: #2d5677; border: 3px solid #fff; display: grid; place-items: center; }
  .profile .who b { font-size: 16px; color: #14202b; padding-bottom: 4px; }
  .profile ul { list-style: none; margin: 10px 0 0; padding: 0; }
  .profile li { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid #9aa5b1; font-size: 13px; color: #1b1f24; }
  .profile li .k { width: 92px; color: #46525e; font-size: 12px; flex: none; }

  /* Topic 7: two workstations, side on. */
  .desk { width: 300px; }
  .desk svg { display: block; }
</style>
