<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #e9ecef; color: #1b1f24;

  .num { display: inline-block; background: #a35200; color: #fff; font: 700 15px/24px Arial, "Liberation Sans", sans-serif;

  /* A Google Sheets grid: column letters, row numbers. */
  .sheet { border-collapse: collapse; font: 17px/1.3 Arial, "Liberation Sans", sans-serif; color: #1b1f24; background: #fff; }
  .sheet th, .sheet td { border: 1px solid #8a96a3; padding: 5px 10px; height: 32px; white-space: nowrap; }
  .sheet th { background: #eef1f4; color: #3c4753; font-weight: 400; font-size: 14px; text-align: center; }
  .sheet th.r { width: 40px; }
  .sheet td.n { text-align: right; }
  .sheet td.h { font-weight: 700; }
  .sheet td.sel { outline: 3px solid #1a62c9; outline-offset: -3px; }
  .sheet td.hi { background: #fbe38e; }
  .sheet td.in { background: #fff; box-shadow: inset 0 0 0 2px #5d6975; }
  .sheet td.link { color: #1a4f9c; text-decoration: underline; }
  .sheet td.out { background: #e3ecf6; }
  .sheet tr.gap th, .sheet tr.gap td { height: 24px; text-align: center; color: #3c4753; font-size: 15px; padding: 0; }
  .warn { position: relative; }
  .warn::after { content: ""; position: absolute; right: 0; top: 0; border-style: solid; border-width: 0 11px 11px 0;
                 border-color: transparent #c4211d transparent transparent; }

  /* The formula bar. */
  .fx { display: flex; align-items: stretch; border: 1px solid #8a96a3; border-bottom: 0; font: 17px Arial, "Liberation Sans", sans-serif; background: #fff; }
  .fx .box { width: 70px; padding: 6px 10px; border-right: 1px solid #8a96a3; }
  .fx .f { padding: 6px 10px; color: #3c4753; font-style: italic; border-right: 1px solid #8a96a3; }
  .fx .v { padding: 6px 12px; font-family: "Liberation Mono", monospace; }

  /* Sheet tabs. */
  .tabs { display: flex; gap: 2px; background: #eef1f4; border: 1px solid #8a96a3; border-top: 0; padding: 0 6px 5px; font: 16px Arial, "Liberation Sans", sans-serif; }
  .tabs span { padding: 7px 16px; color: #3c4753; }
  .tabs span.on { background: #fff; color: #1a4f9c; font-weight: 700; border: 1px solid #8a96a3; border-top: 0; border-radius: 0 0 6px 6px; }

  /* Menus, as Google Sheets draws them. */
  .menubar { display: flex; gap: 16px; padding: 4px 4px 6px; font: 17px Arial, "Liberation Sans", sans-serif; }
  .menubar .open { background: #dfe5ec; border-radius: 4px; padding: 0 6px; margin: 0 -6px; }
  .menus { display: flex; align-items: flex-start; gap: 4px; }
  .gmenu { background: #fff; border: 1.5px solid #8a96a3; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.18); padding: 6px 0; min-width: 250px;
           font: 17px/1.3 Arial, "Liberation Sans", sans-serif; color: #1b1f24; }
  .gmenu .mi { display: flex; justify-content: space-between; gap: 28px; padding: 7px 18px; white-space: nowrap; }

  .gmenu .mi.here { background: #dfe5ec; }
  .gmenu hr { border: 0; border-top: 1.5px solid #c4cbd2; margin: 5px 0; }

  /* Side panels and dialogs. */
  .panel { width: 360px; border: 1.5px solid #8a96a3; border-radius: 8px; padding: 16px 18px; font: 17px/1.4 Arial, "Liberation Sans", sans-serif; color: #1b1f24; background: #fff; }
  .panel h4 { margin: 0 0 12px; font-size: 19px; font-weight: 400; }

  .panel .box2 { border: 1.5px solid #8a96a3; border-radius: 6px; padding: 9px 11px; }
  .panel .radio { display: flex; gap: 9px; align-items: center; margin: 6px 0; }
  .panel .radio i { width: 15px; height: 15px; border: 2px solid #3c4753; border-radius: 50%; display: inline-block; flex: none; }
  .panel .radio i.on { background: radial-gradient(#3c4753 0 4px, transparent 5px); }
  .panel .tick { width: 15px; height: 15px; border: 2px solid #3c4753; border-radius: 2px; display: inline-block; flex: none; }
  .panel .tick.on { background: #3c4753; }
  .panel .tabsrow { display: flex; border-bottom: 1.5px solid #c4cbd2; margin: -4px 0 10px; }
  .panel .tabsrow span { padding: 6px 14px; color: #3c4753; }
  .panel .tabsrow span.on { color: #1a4f9c; border-bottom: 3px solid #1a4f9c; font-weight: 700; }
  .panel .sec { display: flex; justify-content: space-between; padding: 9px 2px; border-bottom: 1px solid #c4cbd2; }
  .btn { display: inline-block; border: 1.5px solid #5d6975; border-radius: 18px; padding: 6px 16px; }
  .btn.blue { background: #1a62c9; border-color: #1a62c9; color: #fff; }
  .drawn { display: inline-block; background: #2e7d32; color: #fff; font-weight: 700; border-radius: 8px; padding: 12px 22px; font-size: 18px; outline: 2px solid #1a62c9; outline-offset: 4px; }

  /* Toolbar with drawn icons. */
  .toolbar { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: #e3e9f2; border-radius: 22px; font: 17px Arial, "Liberation Sans", sans-serif; }
  .toolbar .sep { width: 1.5px; height: 22px; background: #8a96a3; }
  .toolbar .tb { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  /* Charts and code. */
  .chart { font-family: Arial, "Liberation Sans", sans-serif; }
  .chart text { fill: #1b1f24; }
  .chart .axis { stroke: #3c4753; stroke-width: 1.5; }
  .chart .grid { stroke: #b8c0c8; stroke-width: 1; }
  .code { background: #1e2530; color: #e6edf3; font: 15.5px/1.7 "Liberation Mono", monospace; padding: 14px 18px; border-radius: 6px; white-space: pre; margin: 0; }
  .code .k { color: #ff9f8e; } .code .s { color: #9ecbff; } .code .f { color: #7ee0a1; } .code .ln { color: #9aa5b1; display: inline-block; width: 26px; }

  /* Logs and documents. */
  .log { border-collapse: collapse; font: 16px/1.35 Arial, "Liberation Sans", sans-serif; color: #1b1f24; }
  .log th, .log td { border: 1.5px solid #7b8794; padding: 7px 9px; text-align: left; vertical-align: top; }
  .log th { background: #e3ecf6; font-weight: 700; }
  .log caption { text-align: left; font-weight: 700; font-size: 17px; padding-bottom: 8px; }
  .doc { width: 600px; border: 2px solid #7b8794; border-radius: 6px; padding: 16px 20px; font-size: 18px; line-height: 1.45; background: #fff; }
  .doc h3 { margin: 0 0 10px; font-size: 19px; }
  .doc p { margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }

  /* Two formatting styles of one table. */
  .messy td { border: 0; }
  .messy { font-family: "Liberation Serif", serif; }
  .messy .c1 { color: #8a1f9e; font-family: "Liberation Mono", monospace; }

  .tidy td.h { background: #24476b; color: #fff; }
  .tidy tr:nth-child(odd) td:not(.h) { background: #eef3f8; }
