<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #e9ecef; color: #1b1f24;

         display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  figure { margin: 0; background: #fff; padding: 14px; }
  .num { display: inline-block; background: #a35200; color: #fff; font: 700 12px/20px "Segoe UI", Inter, system-ui, sans-serif;
         min-width: 20px; text-align: center; border-radius: 4px; padding: 0 4px; }

  /* A Google Sheets grid: column letters, row numbers, light cells. */
  .sheet { border-collapse: collapse; font: 13px/1.3 Arial, "Liberation Sans", sans-serif; color: #1b1f24; background: #fff; }
  .sheet th, .sheet td { border: 1px solid #8a96a3; padding: 4px 8px; height: 25px; white-space: nowrap; }
  .sheet th { background: #eef1f4; color: #3c4753; font-weight: 400; font-size: 11.5px; text-align: center; }
  .sheet th.r { width: 34px; }
  .sheet td.n { text-align: right; }
  .sheet td.h { font-weight: 700; }
  .sheet td.sel { outline: 2px solid #1a62c9; outline-offset: -2px; }
  .sheet td.hi { background: #fbe38e; }
  .sheet td.blank { background: #fff; }
  .fx { display: flex; align-items: center; gap: 0; border: 1px solid #8a96a3; border-bottom: 0; font: 13px Arial, "Liberation Sans", sans-serif; background: #fff; }
  .fx .box { width: 64px; padding: 5px 8px; border-right: 1px solid #8a96a3; color: #1b1f24; }
  .fx .f { padding: 5px 8px; color: #3c4753; font-style: italic; border-right: 1px solid #8a96a3; }
  .fx .v { padding: 5px 10px; font-family: Consolas, "DejaVu Sans Mono", monospace; color: #1b1f24; }
  .tabs { display: flex; gap: 2px; background: #eef1f4; border: 1px solid #8a96a3; padding: 4px 6px 0; font: 13px Arial, "Liberation Sans", sans-serif; }
  .tabs span { padding: 6px 16px; color: #3c4753; border-radius: 4px 4px 0 0; }
  .tabs span.on { background: #fff; color: #1a4f9c; font-weight: 700; border: 1px solid #8a96a3; border-bottom: 0; }

  /* A cell whose entry failed a "Show a warning" rule: Sheets marks its top-right corner red. */
  .warn { position: relative; }
  .warn::after { content: ""; position: absolute; right: 0; top: 0; border-style: solid; border-width: 0 9px 9px 0;
                 border-color: transparent #c4211d transparent transparent; }

  /* Side panels in the style of Google Sheets. */
  .panel { width: 330px; border: 1px solid #8a96a3; border-radius: 8px; padding: 14px 16px; font: 13px/1.4 Arial, "Liberation Sans", sans-serif; color: #1b1f24; background: #fff; }
  .panel h4 { margin: 0 0 12px; font-size: 15px; font-weight: 400; }
  .panel .k { font-size: 12px; color: #3c4753; margin: 12px 0 5px; display: flex; gap: 8px; align-items: center; }
  .panel .in { border: 1px solid #5d6975; border-radius: 4px; padding: 6px 9px; background: #fff; margin-bottom: 5px; }
  .panel .chip { display: inline-block; border: 1px solid #5d6975; border-radius: 12px; padding: 3px 12px; margin: 0 4px 4px 0; }
  .panel .box2 { border: 1px solid #8a96a3; border-radius: 6px; padding: 8px 10px; }
  .panel .radio { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  .panel .radio i { width: 13px; height: 13px; border: 2px solid #3c4753; border-radius: 50%; display: inline-block; }
  .panel .tick { width: 13px; height: 13px; border: 2px solid #3c4753; border-radius: 2px; display: inline-block; }
  .row { display: flex; gap: 18px; align-items: flex-start; }

  /* Charts. */
  .chart { font-family: Arial, "Liberation Sans", sans-serif; }
  .chart text { fill: #1b1f24; }
  .chart .axis { stroke: #3c4753; stroke-width: 1.2; }
  .chart .grid { stroke: #b8c0c8; stroke-width: 1; }

  /* Code. */
  .code { background: #1e2530; color: #e6edf3; font: 13px/1.65 Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace;
          padding: 12px 16px; border-radius: 6px; white-space: pre; margin: 0; }
  .code .k { color: #ff9f8e; } .code .s { color: #9ecbff; } .code .f { color: #7ee0a1; } .code .ln { color: #9aa5b1; display: inline-block; width: 22px; }

  /* Logs. */
  .log { border-collapse: collapse; font: 12.5px/1.35 Arial, "Liberation Sans", sans-serif; color: #1b1f24; }
  .log th, .log td { border: 1px solid #7b8794; padding: 6px 8px; text-align: left; vertical-align: top; }
  .log th { background: #e3ecf6; font-weight: 700; }
  .log caption { text-align: left; font-weight: 700; font-size: 14px; padding-bottom: 7px; }

  /* Two formatting styles of one table. */
  .messy td, .messy th { border: 0; }
  .messy { font-family: "Times New Roman", serif; }
  .messy .c1 { color: #8a1f9e; font-family: "Courier New", monospace; }
  .messy .c2 { color: #0a6b2a; font-size: 15px; }
  .tidy td.h { background: #24476b; color: #fff; }
  .tidy tr:nth-child(odd) td:not(.h) { background: #eef3f8; }
</style>
