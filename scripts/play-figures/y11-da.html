<!doctype html>
<meta charset="utf-8">
<title>Classroom quiz figures: Year 11 data analytics taster</title>
<!--
  Every <figure data-name> on this page is rendered to public/play/y11-da/<name>.png
  by scripts/render-play-figures.mjs. "s-" figures are for the quiz at the start of
  the session, "e-" figures for the one at the end. All the data is invented, except
  that the map retells John Snow's 1854 Soho cholera map in simplified form. Nothing
  on them gives an answer away: no captions, no pass/fail labels.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #e9ecef; color: #1b1f24;
         font: 16px/1.4 Arial, "Liberation Sans", sans-serif;
         display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  figure { margin: 0; background: #fff; padding: 14px; }

  /* A spreadsheet grid: column letters, row numbers. */
  .sheet { border-collapse: collapse; font: 19px/1.3 Arial, "Liberation Sans", sans-serif; color: #1b1f24; background: #fff; }
  .sheet th, .sheet td { border: 1px solid #8a96a3; padding: 6px 14px; height: 36px; white-space: nowrap; min-width: 120px; }
  .sheet th { background: #eef1f4; color: #3c4753; font-weight: 400; font-size: 15px; text-align: center; min-width: 0; }
  .sheet th.r { width: 40px; }
  .sheet td.n { text-align: right; }
  .sheet td.h { font-weight: 700; }
  .sheet td.sel { outline: 3px solid #1a62c9; outline-offset: -3px; }

  /* The formula bar. */
  .fx { display: flex; align-items: stretch; border: 1px solid #8a96a3; border-bottom: 0; font: 19px Arial, "Liberation Sans", sans-serif; background: #fff; }
  .fx .box { width: 70px; padding: 6px 10px; border-right: 1px solid #8a96a3; }
  .fx .f { padding: 6px 10px; color: #3c4753; font-style: italic; border-right: 1px solid #8a96a3; }
  .fx .v { padding: 6px 12px; font-family: "Liberation Mono", monospace; }

  /* Charts. */
  .chart { font-family: Arial, "Liberation Sans", sans-serif; display: block; }
  .chart text { fill: #1b1f24; }
  .chart .axis { stroke: #3c4753; stroke-width: 1.5; }
  .chart .grid { stroke: #b8c0c8; stroke-width: 1; }

  /* An end-of-year music summary card. */
  .wrapped { width: 440px; padding: 28px 30px; border-radius: 18px; color: #fff;
             background: linear-gradient(150deg, #3b1f6e, #1d3a7a); font-family: Arial, "Liberation Sans", sans-serif; }
  .wrapped .wk { font-size: 17px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #ffd27a; }
  .wrapped .wbig { font-size: 68px; font-weight: 700; line-height: 1.1; margin-top: 10px; }
  .wrapped .wsub { font-size: 22px; margin-bottom: 18px; }
  .wrapped .wrow { display: flex; justify-content: space-between; font-size: 19px; padding: 9px 0; border-top: 1.5px solid #8f86c4; }
  .wrapped .wrow span { color: #e4e0f5; }
</style>

<figure data-name="s-wrapped"><div class="wrapped">
  <div class="wk">Your year in music</div>
  <div class="wbig">41,280</div>
  <div class="wsub">minutes listened</div>
  <div class="wrow"><span>Top genre</span><b>Pop</b></div>
  <div class="wrow"><span>Top song</span><b>Played 312 times</b></div>
  <div class="wrow"><span>Busiest day</span><b>Saturday</b></div>
</div></figure>
