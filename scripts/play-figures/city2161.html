<!doctype html>
<meta charset="utf-8">
<title>Classroom quiz figures: CITY2161 Data modelling and machine learning</title>
<!--
  Every <figure data-name> on this page is rendered to public/play/city2161/<name>.png
  by scripts/render-play-figures.mjs. The figures follow the module's own examples
  (card fraud, phishing sites, phishing hosts); their numbers are invented for the
  quiz, round enough to work out in the time. Nothing on them gives an answer away.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #e9ecef; color: #1b1f24;
         font: 17px/1.4 Arial, "Liberation Sans", sans-serif;
         display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  figure { margin: 0; background: #fff; padding: 18px; }

  /* A confusion matrix. */
  .cm { border-collapse: collapse; font: 20px/1.3 Arial, "Liberation Sans", sans-serif; }
  .cm th, .cm td { border: 1.5px solid #6b7682; padding: 14px 22px; text-align: center; }
  .cm thead th { background: #eef1f4; font-weight: 700; }
  .cm tbody th { background: #eef1f4; font-weight: 700; text-align: left; }
  .cm td { font: 700 28px/1.2 "Liberation Mono", monospace; min-width: 190px; }
  .cm .corner { background: #fff; border-top-color: #fff; border-left-color: #fff; }
  .cm-title { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
  .cm-note { font-size: 17px; color: #3c4753; margin: 12px 0 0; }

  /* Charts. */
  .chart { font-family: Arial, "Liberation Sans", sans-serif; display: block; }
  .chart text { fill: #1b1f24; }
  .chart .axis { stroke: #3c4753; stroke-width: 1.5; }
  .chart .grid { stroke: #b8c0c8; stroke-width: 1; }

  /* A decision tree. */
  .tree text { font-family: Arial, "Liberation Sans", sans-serif; fill: #1b1f24; }
  .tree .q { fill: #eef1f4; stroke: #3c4753; stroke-width: 1.5; }
  .tree .leaf-p { fill: #f7dcd4; stroke: #9a2f1c; stroke-width: 2; }
  .tree .leaf-l { fill: #d5ebdc; stroke: #2a6a43; stroke-width: 2; }
  .tree .edge { stroke: #3c4753; stroke-width: 2; fill: none; }
</style>

<figure data-name="confusion-matrix">
  <p class="cm-title">A fraud detector on 100,000 test payments</p>
  <table class="cm">
    <thead><tr><th class="corner"></th><th>Flagged as fraud</th><th>Not flagged</th></tr></thead>
    <tbody>
      <tr><th>Really fraud</th><td>80</td><td>20</td></tr>
      <tr><th>Really genuine</th><td>320</td><td>99,580</td></tr>
    </tbody>
  </table>
</figure>

<figure data-name="loss-curves"><svg class="chart" width="760" height="440" viewBox="0 0 760 440">
  <text x="400" y="28" font-size="20" font-weight="700" text-anchor="middle">Loss during training</text>
  <!-- Plot area: x 90..730 for epochs 1..20, y 360 (loss 0) .. 60 (loss 0.75). -->
  <line class="grid" x1="90" x2="730" y1="260" y2="260"/>
  <line class="grid" x1="90" x2="730" y1="160" y2="160"/>
  <line class="grid" x1="90" x2="730" y1="60" y2="60"/>
  <line class="axis" x1="90" x2="730" y1="360" y2="360"/>
  <line class="axis" x1="90" x2="90" y1="60" y2="360"/>
  <text x="80" y="366" font-size="17" text-anchor="end">0</text>
  <text x="80" y="266" font-size="17" text-anchor="end">0.25</text>
  <text x="80" y="166" font-size="17" text-anchor="end">0.50</text>
  <text x="80" y="66" font-size="17" text-anchor="end">0.75</text>
  <!-- Epoch ticks: x = 90 + (e-1) * 640/19 -->
  <text x="90" y="386" font-size="17" text-anchor="middle">1</text>
  <text x="225" y="386" font-size="17" text-anchor="middle">5</text>
  <text x="393" y="386" font-size="17" text-anchor="middle">10</text>
  <text x="562" y="386" font-size="17" text-anchor="middle">15</text>
  <text x="730" y="386" font-size="17" text-anchor="middle">20</text>
  <text x="410" y="418" font-size="18" text-anchor="middle">Epoch</text>
  <text x="30" y="210" font-size="18" text-anchor="middle" transform="rotate(-90 30 210)">Loss</text>
  <!-- Training loss: falls steadily. -->
  <polyline fill="none" stroke="#1a62c9" stroke-width="3.5" points="90,96 124,160 157,200 191,228 225,248 258,262 292,274 326,284 359,292 393,299 427,305 460,311 494,316 528,320 562,324 595,327 629,330 663,333 696,335 730,337"/>
  <!-- Validation loss: falls to a minimum at epoch 6, then rises. -->
  <polyline fill="none" stroke="#b4442e" stroke-width="3.5" stroke-dasharray="10 6" points="90,104 124,170 157,214 191,240 225,254 258,258 292,256 326,251 359,245 393,238 427,231 460,224 494,216 528,208 562,200 595,192 629,184 663,176 696,168 730,160"/>
  <!-- Epoch 6 is at x = 258. A light tick so the room can read the curve, with no label that names it. -->
  <line x1="258" x2="258" y1="360" y2="366" stroke="#3c4753" stroke-width="1.5"/>
  <text x="258" y="386" font-size="17" text-anchor="middle" fill="#3c4753">6</text>
  <!-- Legend -->
  <line x1="470" x2="510" y1="86" y2="86" stroke="#1a62c9" stroke-width="3.5"/>
  <text x="520" y="92" font-size="18">Training hosts</text>
  <line x1="470" x2="510" y1="116" y2="116" stroke="#b4442e" stroke-width="3.5" stroke-dasharray="10 6"/>
  <text x="520" y="122" font-size="18">Validation hosts</text>
</svg></figure>

<figure data-name="phishing-tree"><svg class="tree" width="820" height="470" viewBox="0 0 820 470">
  <text x="410" y="28" font-size="20" font-weight="700" text-anchor="middle">A decision tree for phishing websites</text>
  <!-- Root -->
  <rect class="q" x="260" y="48" width="300" height="56" rx="10"/>
  <text x="410" y="83" font-size="19" text-anchor="middle">Does the URL contain "@"?</text>
  <path class="edge" d="M350 104 L170 168"/>
  <text x="240" y="130" font-size="17" text-anchor="middle" font-weight="700">Yes</text>
  <path class="edge" d="M470 104 L620 168"/>
  <text x="572" y="130" font-size="17" text-anchor="middle" font-weight="700">No</text>
  <rect class="leaf-p" x="80" y="168" width="180" height="52" rx="10"/>
  <text x="170" y="201" font-size="20" font-weight="700" text-anchor="middle">Phishing</text>
  <!-- Domain age -->
  <rect class="q" x="480" y="168" width="280" height="56" rx="10"/>
  <text x="620" y="203" font-size="19" text-anchor="middle">Domain under 6 months old?</text>
  <path class="edge" d="M560 224 L430 290"/>
  <text x="480" y="252" font-size="17" text-anchor="middle" font-weight="700">Yes</text>
  <path class="edge" d="M690 224 L720 290"/>
  <text x="724" y="252" font-size="17" text-anchor="middle" font-weight="700">No</text>
  <rect class="leaf-l" x="630" y="290" width="180" height="52" rx="10"/>
  <text x="720" y="323" font-size="20" font-weight="700" text-anchor="middle">Legitimate</text>
  <!-- HTTPS -->
  <rect class="q" x="300" y="290" width="260" height="56" rx="10"/>
  <text x="430" y="325" font-size="19" text-anchor="middle">Does it use HTTPS?</text>
  <path class="edge" d="M380 346 L290 404"/>
  <text x="318" y="372" font-size="17" text-anchor="middle" font-weight="700">Yes</text>
  <path class="edge" d="M480 346 L570 404"/>
  <text x="544" y="372" font-size="17" text-anchor="middle" font-weight="700">No</text>
  <rect class="leaf-l" x="200" y="404" width="180" height="52" rx="10"/>
  <text x="290" y="437" font-size="20" font-weight="700" text-anchor="middle">Legitimate</text>
  <rect class="leaf-p" x="480" y="404" width="180" height="52" rx="10"/>
  <text x="570" y="437" font-size="20" font-weight="700" text-anchor="middle">Phishing</text>
</svg></figure>
