<!doctype html>
<meta charset="utf-8">
<title>Classroom quiz figures: BTEC AAQ IT Unit 3</title>
<!--
  Every <figure data-name> on this page is rendered to public/play/aaq-u3/<name>.png
  by scripts/render-play-figures.mjs. Each is a real rendered page, in the style of
  the Unit 3 lecture figures, with nothing on it that gives an answer away: no
  captions, no pass/fail labels. The studio, the shop and the law firm are invented.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #e9ecef; color: #1b1f24;
         font: 16px/1.45 "Segoe UI", Inter, system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  figure { margin: 0; background: #fff; padding: 14px; }
  .frame { border: 2px solid #b9c2cb; border-radius: 8px; overflow: hidden; background: #fff; }
  .site header { background: #2d5677; color: #fff; padding: 9px 12px; font-weight: 600; font-size: 14px; }
  .site nav { background: #eef2f6; padding: 7px 12px; display: flex; gap: 12px; color: #42545f; font-size: 12px; }
  .band { background: #dce8f2; border-radius: 3px; }
  .line { background: #e3e8ed; border-radius: 2px; height: 7px; margin-bottom: 6px; }
  .line.s { width: 60%; }
  .btn { display: inline-block; background: #1f5d8c; color: #fff; font-weight: 600; border-radius: 5px; }

  /* Topic 2: three layouts for the same shop. */
  .layout { width: 300px; }
  .layout .frame { height: 220px; display: flex; flex-direction: column; }
  .layout .body { padding: 10px; flex: 1; }
  .layout .hero { height: 44px; margin-bottom: 9px; }
  .layout .split { display: flex; gap: 9px; height: 100%; }
  .layout aside { width: 34%; background: #f4f6f8; border: 1px solid #e6ebf0; border-radius: 3px; padding: 7px; }
  .layout .main { flex: 1; }
  .layout .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .layout .card { border: 1px solid #dde3e9; border-radius: 3px; padding: 5px; }
  .layout .card i { display: block; background: #e3e8ed; height: 30px; border-radius: 2px; margin-bottom: 4px; }
  .layout .card .line { height: 5px; margin-bottom: 4px; }

  /* Topic 2: a Z-pattern landing page with the action in four places. */
  .z { width: 300px; }
  .z .frame { height: 210px; position: relative; }
  .z .logo { position: absolute; left: 14px; top: 14px; width: 70px; height: 18px; background: #2d5677; border-radius: 3px; }
  .z .menu { position: absolute; right: 14px; top: 17px; display: flex; gap: 8px; }
  .z .menu span { width: 34px; height: 10px; background: #c8d3dd; border-radius: 2px; }
  .z .headline { position: absolute; left: 14px; top: 56px; width: 140px; height: 18px; background: #3a4652; border-radius: 3px; }
  .z .copy { position: absolute; left: 14px; top: 86px; width: 130px; }
  .z .picture { position: absolute; right: 14px; top: 56px; width: 92px; height: 70px; background: #dce8f2; border-radius: 3px; }
  .z .btn { position: absolute; font-size: 11px; padding: 7px 11px; white-space: nowrap; }

  /* Topic 2: class cards (grouping). */
  .classes { width: 560px; }
  .classes .body { padding: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .classes .card { border: 1px solid #d3dbe2; border-radius: 6px; padding: 11px; font-size: 13px; }
  .classes .card b { display: block; font-size: 14px; margin-bottom: 3px; }
  .classes .card span { display: block; color: #4b5661; }
  .classes .card .btn { display: inline-block; margin-top: 9px; font-size: 12px; padding: 6px 14px; color: #fff; }

  /* Topic 2: three takes on the same hero (hierarchy). */
  .hero-v { width: 300px; }
  .hero-v .body { padding: 14px; height: 170px; }
  .hero-v h3, .hero-v p { margin: 0 0 8px; }
  .flat h3, .flat p, .flat .act { font-size: 13px; font-weight: 400; color: #3c4753; }
  .flat .act { text-decoration: underline; }
  .clear h3 { font-size: 21px; line-height: 1.2; color: #14202b; }
  .clear p { font-size: 12px; color: #4b5661; }
  .clear .btn { font-size: 12.5px; padding: 8px 14px; }
  .shout h3 { font-size: 18px; line-height: 1.15; color: #b02a2a; }
  .shout p { font-size: 17px; font-weight: 700; line-height: 1.2; color: #1f5d8c; }
  .shout .btns { display: flex; gap: 6px; }
  .shout .btn { font-size: 11px; padding: 6px 8px; }

  /* Topic 2: a text-heavy page (scan pattern). */
  .scan { width: 460px; }
  .scan .frame { height: 300px; }
  .scan .body { padding: 12px; font-size: 11px; }
  .scan h2 { font-size: 16px; margin: 0 0 8px; }
  .scan p { margin: 0 0 9px; color: #3c4753; line-height: 1.6; font-size: 11px; }
  .scan .aside { float: right; width: 140px; background: #f4f6f8; border: 1px solid #e6ebf0;
                 border-radius: 4px; padding: 8px; font-size: 10px; color: #6b7681; margin-left: 10px; }

  /* Topic 4: four buttons. Colours are measured by src/features/play/sets/contrast.test.ts. */
  .button-v { width: 240px; }
  .button-v .body { padding: 22px 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .button-v h3 { margin: 0; font-size: 15px; color: #14202b; }
  .button-v .btn { font-size: 14px; padding: 10px 18px; }

  /* Topic 4: keyboard focus. */
  .focus { width: 420px; }
  .focus nav { padding: 11px 14px; display: flex; gap: 9px; }
  .focus nav a { font-size: 12.5px; color: #2d5677; background: #fff; border: 1px solid #d7dee5;
                 padding: 7px 12px; border-radius: 4px; text-decoration: none; }
  .focus .body { padding: 14px; font-size: 12.5px; color: #3c4753; }
  .focus .ring a.on { outline: 3px solid #d4700d; outline-offset: 2px; background: #fff7ec; }
  .focus .keys { margin-top: 9px; font-size: 12px; color: #5b6570; }
  .focus kbd { font: 600 11px/1 "Segoe UI", Inter, system-ui, sans-serif; background: #eceff2;
               border: 1px solid #ccd3da; border-bottom-width: 2px; border-radius: 4px; padding: 3px 6px; }

  /* Topic 4: two pages of one site (branding). */
  .pair { width: 660px; display: flex; gap: 18px; }
  .pair > div { flex: 1; }
  .pair .tag { font-size: 12px; color: #5b6570; margin-bottom: 6px; }
  .pair .body { padding: 12px; height: 120px; font-size: 12px; color: #3c4753; }
  .pair .body b { display: block; font-size: 14px; color: #14202b; margin-bottom: 6px; }
  .pair .btn { font-size: 11.5px; padding: 6px 12px; margin-top: 8px; }
  .pair .other header { background: #7b2d6b; }

  /* Topic 12: page regions. */
  .regions { width: 460px; }
  .regions .frame { position: relative; }
  .regions .r { position: relative; border: 2px dashed #d4700d; margin: 6px; border-radius: 4px; }
  .regions .n { position: absolute; right: -2px; top: -2px; background: #d4700d; color: #fff;
                font: 700 13px/24px "Segoe UI", Inter, system-ui, sans-serif; width: 24px; text-align: center; border-radius: 0 3px 0 4px; }
  .regions .r header { border-radius: 2px 2px 0 0; }
  .regions .content { padding: 12px; font-size: 12px; color: #3c4753; }
  .regions .content b { display: block; font-size: 15px; color: #14202b; margin-bottom: 6px; }
  .regions .foot { padding: 9px 12px; font-size: 11px; color: #6b7681; background: #f4f6f8; }
</style>
